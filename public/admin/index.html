<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS Admin Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Quill Rich Text Editor -->
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>

<body>
  <!-- Login Page -->
  <div id="loginPage" class="login-container">
    <div class="login-box">
      <h1>🚀 CMS Admin</h1>
      <p>Sign in to manage your content</p>
      <div id="loginError" class="alert alert-error hidden"></div>
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="loginUsername" class="form-input" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="loginPassword" class="form-input" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div id="adminDashboard" class="admin-layout hidden">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>📊 CMS Admin</h2>
      </div>
      <nav>
        <ul class="nav-menu">
          <li class="nav-item">
            <a class="nav-link" data-page="dashboard">
              <span>🏠</span>
              <span>Dashboard</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-page="post-types">
              <span>📋</span>
              <span>Post Types</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-page="posts">
              <span>📝</span>
              <span>Posts</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-page="pages">
              <span>📄</span>
              <span>Pages</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-page="menus">
              <span>🔗</span>
              <span>Menus</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-page="categories">
              <span>🏷️</span>
              <span>Categories</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" data-page="tags">
              <span>🔖</span>
              <span>Tags</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" id="logoutBtn">
              <span>🚪</span>
              <span>Logout</span>
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="topbar">
        <h1 id="pageTitle">Dashboard</h1>
        <div id="topbarActions"></div>
      </div>

      <div id="pageContent">
        <!-- Dynamic content will be loaded here -->
      </div>
    </main>
  </div>

  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <script src="/admin/js/admin.js"></script>
  <script src="/admin/js/components/postTypes.js"></script>
  <script src="/admin/js/components/posts.js"></script>
  <script src="/admin/js/components/pages.js"></script>
  <script src="/admin/js/components/menus.js"></script>
  <script src="/admin/js/components/categories.js"></script>
  <script src="/admin/js/components/tags.js"></script>
</body>

</html>
